name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: app_meta
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $config.version
          $productName = $config.productName
          "version=$version" >> $env:GITHUB_OUTPUT
          "product_name=$productName" >> $env:GITHUB_OUTPUT
          "release_tag=v$version" >> $env:GITHUB_OUTPUT
          "release_name=$productName v$version" >> $env:GITHUB_OUTPUT

      - name: Build desktop release
        run: npm run tauri build

      - name: Prepare release notes
        id: release_notes
        shell: pwsh
        run: |
          $version = "${{ steps.app_meta.outputs.version }}"
          $changelogPath = "CHANGELOG.md"
          if (!(Test-Path $changelogPath)) {
            throw "Missing changelog file: $changelogPath"
          }

          $content = Get-Content -Path $changelogPath -Raw -Encoding UTF8
          $normalizedContent = $content.Replace("`r`n", "`n")
          $escapedVersion = [regex]::Escape($version)
          $sectionPattern = "(?ms)^##\s*\[?$escapedVersion\]?(?:\s*-\s*[^\n]+)?\s*$\n(?<body>.*?)(?=^##\s|\z)"
          $releaseBody = ""

          $sectionMatch = [regex]::Match($normalizedContent, $sectionPattern)
          if ($sectionMatch.Success) {
            $releaseBody = "## $version`n`n" + $sectionMatch.Groups["body"].Value.Trim()
          } else {
            $releaseBody = $normalizedContent.Trim()
          }

          if ([string]::IsNullOrWhiteSpace($releaseBody)) {
            throw "CHANGELOG.md is empty."
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP "release-body.md"
          Set-Content -Path $bodyPath -Value $releaseBody -Encoding UTF8
          "body_path=$bodyPath" >> $env:GITHUB_OUTPUT

      - name: Verify release assets
        shell: pwsh
        run: |
          $version = "${{ steps.app_meta.outputs.version }}"
          $productName = "${{ steps.app_meta.outputs.product_name }}"
          $exe = "build-output/release/${productName}_${version}-Portable.exe"
          $nsis = Get-ChildItem "build-output/release/bundle/nsis/*.exe" -ErrorAction Stop | Select-Object -First 1
          $msi = Get-ChildItem "build-output/release/bundle/msi/*.msi" -ErrorAction Stop | Select-Object -First 1
          if (!(Test-Path $exe)) { throw "Missing exe asset: $exe" }
          if (!$nsis) { throw "Missing NSIS asset" }
          if (!$msi) { throw "Missing MSI asset" }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ steps.app_meta.outputs.version }}
          path: |
            build-output/release/*.exe
            build-output/release/bundle/nsis/*.exe
            build-output/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.app_meta.outputs.release_tag }}
          name: ${{ steps.app_meta.outputs.release_name }}
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: |
            build-output/release/*.exe
            build-output/release/bundle/nsis/*.exe
            build-output/release/bundle/msi/*.msi
          bodyFile: ${{ steps.release_notes.outputs.body_path }}
